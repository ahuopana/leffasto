[package]
name = "leffasto"
version = "0.1.0"
description = "Personal movie library"
edition = "2021"

[lib]
name = "leffasto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-http = "2"
